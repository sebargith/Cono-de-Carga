name: CPU analytic tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/demo.txt
      - run: python -m pip install -r requirements/demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo_synthetic.py --output-dir outputs/ci_demo
